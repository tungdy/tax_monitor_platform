[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-risk"
version = "0.1.0"
description = "Group income tax risk monitoring platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "celery>=5.4,<6",
    "cryptography>=46,<49",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "redis>=5,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.120,<7",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff==0.15.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
    "real_redis_worker: starts an independent Celery worker against real Redis",
    "tiered_interface: uses a configured real interface or a deterministic mock fallback",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
